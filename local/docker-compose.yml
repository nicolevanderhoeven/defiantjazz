# Local stack for The Defiant Jazz Incident: Loki, Prometheus, Tempo and Grafana.
# Start it with `docker compose up -d` from this folder, then run the loader with --target local.
services:
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=3650d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Grafana Assistant doesn't support anonymous access, so sign in (default admin / admin).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Preinstall Grafana Assistant; connect it to a Grafana Cloud stack once (see README).
      - GF_PLUGINS_PREINSTALL=grafana-assistant-app
      - GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED=true
      - GF_FEATURE_TOGGLES_ENABLE=externalServiceAccounts
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Keeps the Assistant connection (and anything you save) across restarts.
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [loki, prometheus, tempo]

volumes:
  grafana-data:
